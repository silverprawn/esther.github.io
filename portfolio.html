<!DOCTYPE html>
<html>
<head>
  <title>Esther's PP434 Portfolio</title>
  <!-- The three Vega libraries: they turn JSON into charts -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>

<body>
  <h1>PP434 Portfolio</h1>
  <p><a href="index.html">Back to home</a></p>

  <!-- ========== CC1 ========== -->
  <h2>CC1. Hosting: Display charts in my own site</h2>

  <!-- Empty boxes where the charts will appear -->
  <div id="cc1_chart1"></div>
  <div id="cc1_chart2"></div>
    <!-- ========== CC2 ========== -->
  <h2>CC2. Building: Create my own visualisations</h2>
  <div id="cc2_chart1"></div>
  <div id="cc2_chart2"></div>

  <script>
    // vegaEmbed("#which box", "which JSON file")
    vegaEmbed("#cc1_chart1", "charts/cc1_chart1.json");
    vegaEmbed("#cc1_chart2", "charts/cc1_chart2.json");
        vegaEmbed("#cc2_chart1", "charts/cc2_chart1.json");
    vegaEmbed("#cc2_chart2", "charts/cc2_chart2.json");
  </script>
</body>
</html>
